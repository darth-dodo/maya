name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test

# Spec: openspec/specs/delivery-pipeline. Branch protection requires only ci-success.
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-elixir
      - run: mix format --check-formatted

  credo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-elixir
      - run: mix credo

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-elixir
      - run: mix compile --warnings-as-errors
      # Fails below the test_coverage threshold in mix.exs and prints a per-module table.
      - run: mix test --cover

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-elixir
      - run: mix deps.audit
      - run: mix sobelow --exit high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: maya:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Boot the release with test config and no reachable database: /health must still answer.
      - name: Boot release and probe /health
        run: |
          docker run -d --name maya -p 4000:4000 \
            -e PORT=4000 \
            -e SECRET_KEY_BASE="$(openssl rand -base64 48)" \
            -e DATABASE_URL=ecto://postgres:postgres@127.0.0.1:1/unreachable \
            maya:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:4000/health; then exit 0; fi
            sleep 2
          done
          docker logs maya
          exit 1

  ci-success:
    if: always()
    needs: [format, credo, test, security, docker]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs succeeded
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'to_entries | all(.value.result == "success")'
