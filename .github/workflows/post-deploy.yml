name: Post-deploy smoke check

# Scheduled, never on push: Render's checksPass waits for every check on a commit,
# so a push-triggered check that waits for the deploy deadlocks it.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: post-deploy
  cancel-in-progress: false # a cancelled run could count as a failed check for Render

# Spec: openspec/specs/delivery-pipeline, "Post-deploy smoke check".
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Smoke check the head of main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: scripts/smoke_check.sh
