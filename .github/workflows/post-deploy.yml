name: Post-deploy smoke check

# Scheduled, never on push: Render's checksPass waits for every check on a commit,
# so a push-triggered check that waits for the deploy deadlocks it.
on:
  schedule:
    - cron: "*/15 * * * *"
    # Hourly run that also asks one real Question (E3); each one spends OpenRouter credit.
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: post-deploy
  cancel-in-progress: false # a cancelled run could count as a failed check for Render

# Spec: openspec/specs/delivery-pipeline, "Post-deploy smoke check".
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Smoke check the head of main
        # Never fail the check, even on a hang: Render's checksPass would refuse the deploy.
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ASK: ${{ (github.event.schedule == '7 * * * *' || github.event_name == 'workflow_dispatch') && '1' || '' }}
          SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}
        run: scripts/smoke_check.sh
