<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Maya: Maps, Answers, Yaps, Advice. A spoiler-free Pokémon Emerald companion. So I hear you like Mudkip. Good. Correct choice. An Emerald green ball with a gem button floats above soft tide waves at sunrise.">
